<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Opi - Robot Vezérlő</title>
    <script src="https://unpkg.com"></script>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
        html, body { 
            margin: 0; padding: 0; background: #121212; color: white; font-family: sans-serif; 
            display: flex; flex-direction: column; height: 100vh; height: 100dvh; overflow: hidden; 
        }
        #video-container { 
            flex: 1; background: #000; position: relative; display: flex; 
            align-items: center; justify-content: center; overflow: hidden; min-height: 0;
        }
        video { width: 100%; height: 100%; object-fit: contain; }
        #status { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.7); padding: 6px 12px; border-radius: 5px; font-size: 14px; z-index: 10; }
        #controls { 
            height: 44dvh; display: grid; grid-template-columns: repeat(5, 1fr); grid-template-rows: repeat(3, 1fr); 
            gap: 6px; padding: 8px 8px calc(18px + env(safe-area-inset-bottom)) 8px; background: #1e1e1e; 
        }
        button { background: #2c2c2c; color: white; border: 1px solid #444; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; touch-action: manipulation; }
        button:active, button.flash { background: #00e676 !important; color: #000 !important; }
        .btn-go { background: #1565c0; }
        .btn-cam { background: #4a148c; }
    </style>
</head>
<body>

<div id="video-container">
    <div id="status">Indítás..v11.</div>
    <video id="remote-video" autoplay playsinline muted></video>
</div>

<div id="controls">
    <button onclick="sendCmd('Z+', this)">Z+</button>
    <button onclick="sendCmd('Z-', this)">Z-</button>
    <button class="btn-go" onclick="sendCmd('Go3', this)">Go3</button>
    <button onclick="sendCmd('Front', this)">Front</button>
    <button onclick="sendCmd('Back', this)">Back</button>

    <button class="btn-cam" onclick="sendCmd('CL90', this)">CL90</button>
    <button class="btn-cam" onclick="sendCmd('CL', this)">CL</button>
    <button class="btn-go" onclick="sendCmd('Go2', this)">Go2</button>
    <button class="btn-cam" onclick="sendCmd('CR', this)">CR</button>
    <button class="btn-cam" onclick="sendCmd('CR90', this)">CR90</button>

    <button onclick="sendCmd('RL90', this)">RL90</button>
    <button onclick="sendCmd('RL', this)">RL</button>
    <button class="btn-go" onclick="sendCmd('Go', this)">Go</button>
    <button onclick="sendCmd('RR', this)">RR</button>
    <button onclick="sendCmd('RR90', this)">RR90</button>
</div>

<script>
    const LIVEKIT_URL = "wss://konzultacio1-robot-remote-6dg9v376.livekit.cloud";
    const API_KEY = "APIWmApdsmBWbRx";
    const API_SECRET = "jsfujp4fEas5azWkEI95XgxX5HNHMthA2cR1GM51XFC";
    const ROOM_NAME = "robi-szoba-1";
    let room;

    async function createToken(identity, roomName) {
        const header = { alg: "HS256", typ: "JWT" };
        const now = Math.floor(Date.now() / 1000);
        const payload = {
            iss: API_KEY, sub: identity, nbf: now, exp: now + 86400,
            video: { room: roomName, roomJoin: true, canPublish: true, canSubscribe: true, canPublishData: true }
        };
        const encode = obj => btoa(JSON.stringify(obj)).replace(/=/g, '').replace(/\+/g, '-').replace(/\//g, '_');
        const unsigned = `${encode(header)}.${encode(payload)}`;
        const key = await crypto.subtle.importKey("raw", new TextEncoder().encode(API_SECRET), { name: "HMAC", hash: "SHA-256" }, false, ["sign"]);
        const sig = await crypto.subtle.sign("HMAC", key, new TextEncoder().encode(unsigned));
        const sigBase64 = btoa(String.fromCharCode(...new Uint8Array(sig))).replace(/=/g, '').replace(/\+/g, '-').replace(/\//g, '_');
        return `${unsigned}.${sigBase64}`;
    }

    async function init() {
        const statusEl = document.getElementById('status');
        try {
            if (typeof LivekitClient === 'undefined') {
                statusEl.innerText = "Hiba: LiveKit könyvtár nem töltődött be!";
                return;
            }
            statusEl.innerText = "Token készítés...";
            const token = await createToken("Opi_Operator", ROOM_NAME);
            room = new LivekitClient.Room();

            room.on(LivekitClient.RoomEvent.TrackSubscribed, (track) => {
                if (track.kind === LivekitClient.Track.Kind.Video) {
                    const videoEl = document.getElementById('remote-video');
                    track.attach(videoEl);
                    videoEl.play().catch(() => {});
                    statusEl.innerText = "ÉLŐ VIDEÓ (" + ROOM_NAME + ")";
                }
            });

            statusEl.innerText = "Csatlakozás LiveKit-hez...";
            await room.connect(LIVEKIT_URL, token);
            statusEl.innerText = "Csatlakozva! Várakozás Robira...";
            sendRaw("WAKE_UP");
        } catch (e) {
            statusEl.innerText = "Hiba: " + e.message;
        }
    }

    function sendRaw(text) {
        if (!room || room.state !== 'connected') return;
        room.localParticipant.publishData(new TextEncoder().encode(text), { reliable: true });
    }

    function sendCmd(cmd, btn) {
        btn.classList.add('flash');
        setTimeout(() => btn.classList.remove('flash'), 150);
        sendRaw(cmd);
    }
    window.onerror = function(msg, url, line) {
    document.getElementById('status').innerText = "JS Hiba (" + line + ". sor): " + msg;
};
window.onload = init;
   
</script>
</body>
</html>
