<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Opi - Robot Vezérlő</title>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
        html, body { 
            margin: 0; 
            padding: 0; 
            background: #121212; 
            color: white; 
            font-family: sans-serif; 
            display: flex; 
            flex-direction: column; 
            height: 100vh; 
            height: 100dvh;
            overflow: hidden; 
        }
        #video-container { 
            flex: 1; 
            background: #000; 
            position: relative; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            overflow: hidden; 
            min-height: 0;
        }
        video { width: 100%; height: 100%; object-fit: contain; }
        #status { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.6); padding: 5px 10px; border-radius: 5px; font-size: 14px; z-index: 10; }
        #controls { 
            height: 44dvh; 
            display: grid; 
            grid-template-columns: repeat(5, 1fr); 
            grid-template-rows: repeat(3, 1fr); 
            gap: 6px; 
            padding: 8px 8px calc(18px + env(safe-area-inset-bottom)) 8px;
            background: #1e1e1e; 
        }
        button { background: #2c2c2c; color: white; border: 1px solid #444; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; touch-action: manipulation; transition: background 0.1s; }
        button:active, button.flash { background: #00e676 !important; color: #000 !important; }
        .btn-go { background: #1565c0; }
        .btn-cam { background: #4a148c; }
    </style>
</head>
<body>

<div id="video-container">
    <div id="status">Betöltés...</div>
    <video id="remote-video" autoplay playsinline></video>
</div>

<div id="controls">
    <!-- 3. sor (felül) -->
    <button data-cmd="Z+">Z+</button>
    <button data-cmd="Z-">Z-</button>
    <button class="btn-go" data-cmd="Go3">Go3</button>
    <button data-cmd="Front">Front</button>
    <button data-cmd="Back">Back</button>

    <!-- 2. sor (közép) -->
    <button class="btn-cam" data-cmd="CL90">CL90</button>
    <button class="btn-cam" data-cmd="CL">CL</button>
    <button class="btn-go" data-cmd="Go2">Go2</button>
    <button class="btn-cam" data-cmd="CR">CR</button>
    <button class="btn-cam" data-cmd="CR90">CR90</button>

    <!-- 1. sor (alul) -->
    <button data-cmd="RL90">RL90</button>
    <button data-cmd="RL">RL</button>
    <button class="btn-go" data-cmd="Go">Go</button>
    <button data-cmd="RR">RR</button>
    <button data-cmd="RR90">RR90</button>
</div>

<script type="module">
    import { Room, RoomEvent, Track } from 'https://esm.sh';

    const LIVEKIT_URL = "wss://konzultacio1-robot-remote-6dg9v376.livekit.cloud";
    const API_KEY = "APIWmApdsmBWbRx";
    const API_SECRET = "jsfujp4fEas5azWkEI95XgxX5HNHMthA2cR1GM51XFC";
    const urlParams = new URLSearchParams(window.location.search);
    const ROOM_NAME = urlParams.get('room') || "robi-szoba-1";

    let room;

    async function createToken(identity, roomName) {
        const header = { alg: "HS256", typ: "JWT" };
        const now = Math.floor(Date.now() / 1000);
        const payload = {
            iss: API_KEY,
            sub: identity,
            nbf: now,
            exp: now + 86400,
            video: { room: roomName, roomJoin: true, canPublish: true, canSubscribe: true, canPublishData: true }
        };
        const encode = obj => btoa(JSON.stringify(obj)).replace(/=/g, '').replace(/\+/g, '-').replace(/\//g, '_');
        const unsigned = `${encode(header)}.${encode(payload)}`;
        const key = await crypto.subtle.importKey("raw", new TextEncoder().encode(API_SECRET), { name: "HMAC", hash: "SHA-256" }, false, ["sign"]);
        const sig = await crypto.subtle.sign("HMAC", key, new TextEncoder().encode(unsigned));
        const sigBase64 = btoa(String.fromCharCode(...new Uint8Array(sig))).replace(/=/g, '').replace(/\+/g, '-').replace(/\//g, '_');
        return `${unsigned}.${sigBase64}`;
    }

    function sendRaw(text) {
        if (!room || room.state !== 'connected') return;
        const data = new TextEncoder().encode(text);
        room.localParticipant.publishData(data, { reliable: true });
    }

    document.querySelectorAll('#controls button').forEach(btn => {
        btn.addEventListener('click', () => {
            const cmd = btn.getAttribute('data-cmd');
            btn.classList.add('flash');
            setTimeout(() => btn.classList.remove('flash'), 150);
            sendRaw(cmd);
        });
    });

    async function init() {
        const statusEl = document.getElementById('status');
        try {
            statusEl.innerText = "Token generálás...";
            const token = await createToken("Opi_Operator", ROOM_NAME);
            room = new Room();

            room.on(RoomEvent.TrackSubscribed, (track) => {
                if (track.kind === Track.Kind.Video) {
                    const videoEl = document.getElementById('remote-video');
                    track.attach(videoEl);
                    statusEl.innerText = "Élő kapcsolat (" + ROOM_NAME + ")";
                }
            });

            room.on(RoomEvent.TrackUnsubscribed, () => {
                statusEl.innerText = "Robi kamerája kikapcsolva";
            });

            statusEl.innerText = "Csatlakozás szerverhez...";
            await room.connect(LIVEKIT_URL, token);
            statusEl.innerText = "Csatlakozva (" + ROOM_NAME + ")";
            sendRaw("WAKE_UP");
        } catch (e) {
            statusEl.innerText = "Hiba: " + e.message;
        }
    }

    init();
</script>
</body>
</html>
